name: Sync Upstream and Build

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Damien Hauser"
          git config user.email "damien.hauser@gmail.com"
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch upstream --tags

      - name: Check for new upstream tag
        id: check
        run: |
          TAG=$(git ls-remote --tags upstream | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already in fork, nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New tag $TAG detected, syncing."
          fi

      - name: Merge, patch, and push
        if: steps.check.outputs.new == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git merge upstream/main --no-edit

          find .github/workflows -type f \
            | grep -v -E '/(docker-build-push|sync-upstream)\.yml$' \
            | xargs git rm -f --ignore-unmatch

          git apply --3way patches/remove-premium-checks.patch
          git add -A
          git commit -m "Sync upstream $TAG + apply custom patches"

          git tag "$TAG"
          git push origin main
          git push origin "$TAG"
